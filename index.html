<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch-a-Sketch</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Etch-a-Sketch</h1>

  <div class="controls">
    <label for="grid-size">Grid Size (Sides):</label>
    <input type="number" id="grid-size" min="1" max="100" value="16" placeholder="1-100">
    <button type="button" id="resize-button">Change Size</button>
    <button type="button" id="reset-button">Reset</button>
  </div>

  <div class="container">
    <!-- Inject div containers through javascript -->
  </div>
</body>
</html>
